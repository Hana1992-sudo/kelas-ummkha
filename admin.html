<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Kelas UmmKha</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f7f3fb;margin:0;color:#302b38}
.box{max-width:700px;margin:30px auto;padding:20px}
.card{background:white;padding:20px;border-radius:16px;margin:15px 0;box-shadow:0 3px 12px #ddd}
input,textarea,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}
button{background:#7b4fa3;color:white;border:0;font-weight:bold}
h1{color:#70408f}
.hide{display:none}
.item{border:1px solid #ddd;padding:12px;border-radius:10px;margin:10px 0}
</style>
</head>

<body>
<div class="box">

<div id="login" class="card">
<h1>Admin Kelas UmmKha 🌷</h1>
<input id="email" type="email" placeholder="Email Admin">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">MASUK</button>
<p id="msg"></p>
</div>

<div id="panel" class="hide">
<h1>Dashboard Admin 🌷</h1>
<button onclick="logout()">Keluar</button>

<div class="card">
<h2>Tambah Materi</h2>
<input id="judul" placeholder="Judul materi">
<input id="urutan" type="number" placeholder="Urutan">
<input id="slug" placeholder="Slug, contoh: karakter-faceless">
<textarea id="deskripsi" placeholder="Deskripsi"></textarea>
<input id="video" placeholder="Link video YouTube">
<input id="pdf" placeholder="Link PDF">
<textarea id="isi" placeholder="Isi materi"></textarea>
<textarea id="tugas" placeholder="Tugas peserta"></textarea>
<input id="setoran" placeholder="Link setoran tugas">
<select id="status">
<option value="published">Published</option>
<option value="coming_soon">Segera Hadir</option>
<option value="draft">Draft</option>
</select>
<button onclick="simpan()">SIMPAN MATERI</button>
<p id="hasil"></p>
</div>

<div class="card">
<h2>Daftar Materi</h2>
<div id="list">Memuat...</div>
</div>
</div>

</div>

<script>
const URL="https://sngesuutjswqsgqciogi.supabase.co";
const KEY="sb_publishable_L8MDEGxyBOsyx_LM9GOvaw_AWVP1GuE";
const db=supabase.createClient(URL,KEY);

async function login(){
msg.textContent="Memproses...";
const {data,error}=await db.auth.signInWithPassword({
email:email.value,password:password.value
});
if(error){msg.textContent=error.message;return}

const {data:p,error:e}=await db.from("profiles")
.select("role,nama").eq("id",data.user.id).single();

if(e||!p||p.role!=="admin"){
await db.auth.signOut();
msg.textContent="Akun ini bukan Admin.";
return;
}
loginBox();
}

function loginBox(){
login.classList.add("hide");
panel.classList.remove("hide");
load();
}

async function logout(){
await db.auth.signOut();
location.reload();
}

async function load(){
const {data,error}=await db.from("materials")
.select("*").order("urutan");

if(error){list.innerHTML="Gagal memuat: "+error.message;return}

list.innerHTML="";
data.forEach(x=>{
list.innerHTML+=`
<div class="item">
<b>${x.urutan}. ${x.judul}</b><br>
Status: ${x.status}<br>
<small>${x.deskripsi||""}</small>
</div>`;
});
}

async function simpan(){
const row={
urutan:Number(urutan.value),
judul:judul.value,
slug:slug.value,
deskripsi:deskripsi.value,
video_url:video.value,
pdf_url:pdf.value,
isi_materi:isi.value,
tugas:tugas.value,
link_setoran:setoran.value,
status:status.value
};

const {error}=await db.from("materials").insert(row);

if(error){
hasil.textContent="Gagal: "+error.message;
}else{
hasil.textContent="Materi berhasil disimpan 🌷";
load();
}
}
</script>
</body>
</html>
