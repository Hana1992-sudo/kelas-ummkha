<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin UmmKha</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;background:#f7f3fb;padding:20px}
main{max-width:700px;margin:auto}
section{background:white;padding:18px;border-radius:15px;margin:15px 0}
input,textarea,select,button{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;border-radius:8px;border:1px solid #ddd}
button{background:#79509b;color:white;border:0;font-weight:bold}
.hide{display:none}
.item{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:10px}
.red{background:#c44}
</style>
</head>

<body>

<main>

<section id="login">
<h2>Admin Kelas UmmKha 🌷</h2>

<input id="email" placeholder="Email Admin">
<input id="pass" type="password" placeholder="Password">

<button onclick="masuk()">MASUK</button>

<p id="pesan"></p>
</section>


<div id="app" class="hide">

<section>
<h2>Dashboard Admin</h2>
<button onclick="keluar()">KELUAR</button>
</section>


<section>

<h3 id="judulForm">Tambah Materi</h3>

<input id="urut" type="number" placeholder="Urutan">

<input id="judul" placeholder="Judul materi">

<input id="slug" placeholder="Slug">

<textarea id="desc" placeholder="Deskripsi"></textarea>

<input id="video" placeholder="Link YouTube">

<input id="pdf" placeholder="Link PDF">

<textarea id="isi" placeholder="Isi materi"></textarea>

<textarea id="prompt" placeholder="📋 Prompt Materi"></textarea>

<textarea id="tugas" placeholder="Tugas"></textarea>

<input id="setoran" placeholder="Link setoran">

<select id="status">
<option value="published">Published</option>
<option value="coming_soon">Segera Hadir</option>
<option value="draft">Draft</option>
</select>

<button onclick="simpan()">SIMPAN</button>

<button id="batal" class="hide" onclick="reset()">BATAL EDIT</button>

<p id="hasil"></p>

</section>


<section>

<h3>Daftar Materi</h3>

<div id="daftar">Memuat...</div>

</section>

</div>

</main>


<script>

const db=supabase.createClient(
"https://sngesuutjswqsgqciogi.supabase.co",
"sb_publishable_L8MDEGxyBOsyx_LM9GOvaw_AWVP1GuE"
);

let editId=null;

const $=id=>document.getElementById(id);


async function masuk(){

$("pesan").textContent="Memproses...";

const r=await db.auth.signInWithPassword({
email:$("email").value.trim(),
password:$("pass").value
});

if(r.error){
$("pesan").textContent=r.error.message;
return;
}

const p=await db
.from("profiles")
.select("role")
.eq("id",r.data.user.id)
.maybeSingle();

if(p.error||!p.data||p.data.role!="admin"){

$("pesan").textContent="Akun bukan Admin.";

await db.auth.signOut();

return;
}

$("login").classList.add("hide");
$("app").classList.remove("hide");

muat();

}


async function keluar(){

await db.auth.signOut();

location.reload();

}


async function muat(){

const r=await db
.from("materials")
.select("*")
.order("urutan");

if(r.error){

$("daftar").textContent=r.error.message;

return;
}

$("daftar").innerHTML=r.data.map(x=>`

<div class="item">

<b>${x.urutan}. ${x.judul}</b><br>

Status: ${x.status}

<button onclick="edit('${x.id}')">EDIT</button>

<button class="red" onclick="hapus('${x.id}')">HAPUS</button>

</div>

`).join("");

}


async function edit(id){

const r=await db
.from("materials")
.select("*")
.eq("id",id)
.single();

if(r.error){

alert(r.error.message);

return;
}

const x=r.data;

editId=id;

$("urut").value=x.urutan||"";
$("judul").value=x.judul||"";
$("slug").value=x.slug||"";
$("desc").value=x.deskripsi||"";
$("video").value=x.video_url||"";
$("pdf").value=x.pdf_url||"";
$("isi").value=x.isi_materi||"";
$("prompt").value=x.prompt||"";
$("tugas").value=x.tugas||"";
$("setoran").value=x.link_setoran||"";
$("status").value=x.status||"draft";

$("judulForm").textContent="Edit Materi";

$("batal").classList.remove("hide");

window.scrollTo(0,0);

}


async function simpan(){

const row={

urutan:+$("urut").value,

judul:$("judul").value,

slug:$("slug").value,

deskripsi:$("desc").value,

video_url:$("video").value,

pdf_url:$("pdf").value,

isi_materi:$("isi").value,

prompt:$("prompt").value,

tugas:$("tugas").value,

link_setoran:$("setoran").value,

status:$("status").value,

updated_at:new Date().toISOString()

};

let r=editId
?await db.from("materials").update(row).eq("id",editId)
:await db.from("materials").insert(row);

if(r.error){

$("hasil").textContent="Gagal: "+r.error.message;

return;
}

$("hasil").textContent="Berhasil disimpan 🌷";

reset();

muat();

}


async function hapus(id){

if(!confirm("Hapus materi ini?"))return;

const r=await db
.from("materials")
.delete()
.eq("id",id);

if(r.error){

alert(r.error.message);

return;
}

muat();

}


function reset(){

editId=null;

[
"urut",
"judul",
"slug",
"desc",
"video",
"pdf",
"isi",
"prompt",
"tugas",
"setoran"
].forEach(x=>$(x).value="");

$("status").value="published";

$("judulForm").textContent="Tambah Materi";

$("batal").classList.add("hide");

}

</script>

</body>
</html>
