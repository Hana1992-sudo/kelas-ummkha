<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Kelas UmmKha</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f7f3fb;margin:0;color:#302b38}
.box{max-width:700px;margin:30px auto;padding:20px}
.card{background:#fff;padding:20px;border-radius:16px;margin:15px 0}
input,textarea,select,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:9px}
button{background:#7b4fa3;color:white;border:0;font-weight:bold}
.hide{display:none}
.item{padding:12px;border:1px solid #ddd;border-radius:10px;margin:10px 0}
</style>
</head>

<body>
<div class="box">

<div id="loginBox" class="card">
<h1>Admin Kelas UmmKha 🌷</h1>
<input id="email" type="email" placeholder="Email Admin">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">MASUK</button>
<p id="msg"></p>
</div>

<div id="adminBox" class="hide">
<h1>Dashboard Admin 🌷</h1>
<button id="logoutBtn">KELUAR</button>

<div class="card">
<h2>Tambah Materi</h2>
<input id="urutan" type="number" placeholder="Urutan">
<input id="judul" placeholder="Judul materi">
<input id="slug" placeholder="Slug, contoh: materi-1">
<textarea id="deskripsi" placeholder="Deskripsi"></textarea>
<input id="video" placeholder="Link YouTube">
<input id="pdf" placeholder="Link PDF">
<textarea id="isi" placeholder="Isi materi"></textarea>
<textarea id="tugas" placeholder="Tugas peserta"></textarea>
<input id="setoran" placeholder="Link setoran">
<select id="status">
<option value="published">Published</option>
<option value="coming_soon">Segera Hadir</option>
<option value="draft">Draft</option>
</select>
<button id="saveBtn">SIMPAN MATERI</button>
<p id="hasil"></p>
</div>

<div class="card">
<h2>Daftar Materi</h2>
<div id="list">Memuat...</div>
</div>
</div>

</div>

<script>
const SUPABASE_URL="https://sngesuutjswqsgqciogi.supabase.co";
const SUPABASE_KEY="sb_publishable_L8MDEGxyBOsyx_LM9GOvaw_AWVP1GuE";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);

$("loginBtn").onclick=async()=>{
  $("msg").textContent="Memproses...";

  try{
    const result=await Promise.race([
      db.auth.signInWithPassword({
        email:$("email").value.trim(),
        password:$("password").value
      }),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error("Koneksi Supabase terlalu lama. Coba refresh halaman.")),10000))
    ]);

    if(result.error){
      $("msg").textContent="Login gagal: "+result.error.message;
      return;
    }

    const user=result.data.user;

    const profile=await db.from("profiles")
      .select("role,nama")
      .eq("id",user.id)
      .maybeSingle();

    if(profile.error){
      $("msg").textContent="Login berhasil, tetapi profil Admin tidak bisa dibaca: "+profile.error.message;
      return;
    }

    if(!profile.data || profile.data.role!=="admin"){
      $("msg").textContent="Akun berhasil login, tetapi belum memiliki akses Admin.";
      await db.auth.signOut();
      return;
    }

    $("loginBox").classList.add("hide");
    $("adminBox").classList.remove("hide");
    loadMaterials();

  }catch(e){
    $("msg").textContent=e.message;
  }
};

$("logoutBtn").onclick=async()=>{
  await db.auth.signOut();
  location.reload();
};

async function loadMaterials(){
  const r=await db.from("materials").select("*").order("urutan");

  if(r.error){
    $("list").textContent="Gagal memuat materi: "+r.error.message;
    return;
  }

  $("list").innerHTML=r.data.length
    ? r.data.map(x=>`
      <div class="item">
      <b>${x.urutan}. ${x.judul}</b><br>
      Status: ${x.status}
      </div>`).join("")
    : "Belum ada materi.";
}

$("saveBtn").onclick=async()=>{
  $("hasil").textContent="Menyimpan...";

  const row={
    urutan:Number($("urutan").value),
    judul:$("judul").value,
    slug:$("slug").value,
    deskripsi:$("deskripsi").value,
    video_url:$("video").value,
    pdf_url:$("pdf").value,
    isi_materi:$("isi").value,
    tugas:$("tugas").value,
    link_setoran:$("setoran").value,
    status:$("status").value
  };

  const r=await db.from("materials").insert(row);

  if(r.error){
    $("hasil").textContent="Gagal: "+r.error.message;
  }else{
    $("hasil").textContent="Materi berhasil disimpan 🌷";
    loadMaterials();
  }
};
</script>
</body>
</html>
