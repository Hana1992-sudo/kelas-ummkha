<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kelas UmmKha</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial;background:#f7f3fb;color:#302b38}
.wrap{max-width:850px;margin:auto;padding:20px}
.card{background:white;padding:20px;border-radius:18px;margin:15px 0;box-shadow:0 4px 18px #0001}
input,button{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border-radius:10px;border:1px solid #ddd}
button{background:#76519a;color:white;border:0;font-weight:bold}
.secondary{background:#eee5f5;color:#76519a}
.hidden{display:none}
.error{background:#fff0f0;color:#b42318;padding:10px;border-radius:10px;margin:8px 0}
.success{background:#effbf3;color:#18794e;padding:10px;border-radius:10px;margin:8px 0}
.material{border-top:1px solid #eee;padding-top:18px;margin-top:18px}
.badge{display:inline-block;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold;background:#eee5f8;color:#76519a}
.soon{background:#fff1d0;color:#996b00}
.video{position:relative;padding-bottom:56.25%;margin:12px 0}
.video iframe{position:absolute;width:100%;height:100%;border:0;border-radius:12px}
.task{background:#faf7fd;border-left:4px solid #76519a;padding:14px;margin-top:12px;border-radius:8px}
.small{color:#777;font-size:14px;line-height:1.6}
</style>
</head>

<body>
<div class="wrap">

<section id="login" class="card">
<h1>🌷 Kelas UmmKha</h1>
<p class="small">Silakan masuk menggunakan akun peserta.</p>
<input id="email" type="email" placeholder="Email peserta">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">MASUK</button>
<div id="loginMsg"></div>
</section>

<div id="app" class="hidden">

<section class="card">
<h1>🌷 Kelas UmmKha</h1>
<p id="welcome" class="small"></p>
<button onclick="akun()">👤 Akun Saya</button>
<button class="secondary" onclick="logout()">KELUAR</button>
</section>

<section id="akunBox" class="card hidden">
<h2>👤 Akun Saya</h2>
<p id="akunNama" class="small"></p>

<label>Email</label>
<input id="newEmail" type="email" placeholder="Email baru">
<button onclick="ubahEmail()">UBAH EMAIL</button>
<div id="emailMsg"></div>

<hr>

<h3>🔐 Ganti Password</h3>
<input id="newPass" type="password" placeholder="Password baru">
<input id="newPass2" type="password" placeholder="Ulangi password baru">
<button onclick="ubahPassword()">GANTI PASSWORD</button>
<div id="passMsg"></div>

<button class="secondary" onclick="akun()">TUTUP</button>
</section>

<section class="card">
<h2>📚 Materi Kelas</h2>
<div id="materials">Memuat materi...</div>
</section>

</div>
</div>

<script>
const db=supabase.createClient(
"https://sngesuutjswqsgqciogi.supabase.co",
"sb_publishable_L8MDEGxyBOsyx_LM9GOvaw_AWVP1GuE"
);

let profile=null;

const $=id=>document.getElementById(id);

function msg(id,text,type="error"){
 $(id).innerHTML='<div class="'+type+'">'+text+'</div>';
}

function esc(x){
 return String(x||"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#039;"
 }[c]));
}

function video(url){
 if(!url)return"";
 try{
  const u=new URL(url);
  let id=u.hostname.includes("youtu.be")
   ?u.pathname.slice(1)
   :u.searchParams.get("v");
  if(!id&&url.includes("/embed/"))
   id=url.split("/embed/")[1].split("?")[0];
  if(!id)return"";
  return '<div class="video"><iframe src="https://www.youtube.com/embed/'+
   esc(id)+'" allowfullscreen></iframe></div>';
 }catch(e){return""}
}

async function login(){
 $("loginMsg").textContent="Memproses...";

 const r=await db.auth.signInWithPassword({
  email:$("email").value.trim(),
  password:$("password").value
 });

 if(r.error){
  msg("loginMsg","Email atau password salah.");
  return;
 }

 const p=await db.from("profiles")
  .select("id,nama,role")
  .eq("id",r.data.user.id)
  .maybeSingle();

 if(p.error||!p.data){
  await db.auth.signOut();
  msg("loginMsg","Profil peserta belum ditemukan.");
  return;
 }

 if(p.data.role!=="peserta"){
  await db.auth.signOut();
  msg("loginMsg","Akun ini bukan akun peserta.");
  return;
 }

 profile=p.data;
 masukApp();
}

function masukApp(){
 $("login").classList.add("hidden");
 $("app").classList.remove("hidden");
 $("welcome").textContent="Halo, "+(profile.nama||"Peserta")+" 🌷";
 $("akunNama").textContent="Nama: "+(profile.nama||"Peserta");
 load();
}

async function load(){
 const r=await db.from("materials")
  .select("*")
  .in("status",["published","coming_soon"])
  .order("urutan");

 if(r.error){
  $("materials").textContent="Materi belum dapat dimuat.";
  return;
 }

 $("materials").innerHTML=r.data.map((m,i)=>{
  const soon=m.status==="coming_soon";

  let h='<article class="material">';
  h+='<span class="badge '+(soon?"soon":"")+'">';
  h+=soon?"⏳ SEGERA HADIR":"✓ TERSEDIA";
  h+='</span>';
  h+='<h2>'+(i+1)+'. '+esc(m.judul)+'</h2>';

  if(m.deskripsi)
   h+='<p>'+esc(m.deskripsi)+'</p>';

  if(soon){
   h+='<p class="small">Materi ini sedang dipersiapkan.<br>InsyaAllah segera tersedia 🌷</p>';
  }else{
   h+=video(m.video_url);

   if(m.isi_materi)
    h+='<div><h3>📖 Materi</h3><div class="small">'+
     esc(m.isi_materi).replace(/\n/g,"<br>")+'</div></div>';

   if(m.tugas)
    h+='<div class="task"><b>📝 Tugas</b><br><br>'+
     esc(m.tugas).replace(/\n/g,"<br>")+'</div>';

   if(m.link_setoran)
    h+='<a href="'+esc(m.link_setoran)+
     '" target="_blank"><button>📤 KUMPULKAN TUGAS</button></a>';

   if(m.pdf_url)
    h+='<a href="'+esc(m.pdf_url)+
     '" target="_blank"><button>📄 BUKA PDF</button></a>';
  }

  return h+'</article>';
 }).join("");
}

function akun(){
 $("akunBox").classList.toggle("hidden");
}

async function ubahEmail(){
 const email=$("newEmail").value.trim();

 if(!email){
  msg("emailMsg","Masukkan email baru.");
  return;
 }

 const r=await db.auth.updateUser({email:email});

 if(r.error){
  msg("emailMsg",r.error.message);
  return;
 }

 msg("emailMsg",
 "Permintaan perubahan email berhasil. Silakan cek email baru untuk konfirmasi.",
 "success");
}

async function ubahPassword(){
 const a=$("newPass").value;
 const b=$("newPass2").value;

 if(a.length<6){
  msg("passMsg","Password minimal 6 karakter.");
  return;
 }

 if(a!==b){
  msg("passMsg","Password tidak sama.");
  return;
 }

 const r=await db.auth.updateUser({password:a});

 if(r.error){
  msg("passMsg",r.error.message);
  return;
 }

 $("newPass").value="";
 $("newPass2").value="";

 msg("passMsg","Password berhasil diubah 🌷","success");
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

async function session(){
 const r=await db.auth.getSession();

 if(!r.data.session)return;

 const p=await db.from("profiles")
  .select("id,nama,role")
  .eq("id",r.data.session.user.id)
  .maybeSingle();

 if(p.data&&p.data.role==="peserta"){
  profile=p.data;
  masukApp();
 }else{
  await db.auth.signOut();
 }
}

session();
</script>
</body>
</html>
