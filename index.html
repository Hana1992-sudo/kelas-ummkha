<style>

.badge{

  background:#fff7d6;

}
.video{

.video iframe{

.task{

  margin-top:15px;

}
.prompt{
  background:#fff9e8;
  border-left:4px solid #d6a62a;
  padding:14px;
  margin-top:15px;
  border-radius:8px;
  white-space:pre-wrap;
}
.small{
  color:#666;
  font-size:13px;
}
a{
  color:#76519a;
  font-weight:bold;
}
.topbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.topbar button{
  width:auto;
  flex:1;
  min-width:130px;
}
</style>
</head>

<body>

<div class="wrap">

  <!-- LOGIN -->
  <div id="login" class="card">
    <h1>Kelas UmmKha</h1>
    <p class="small">Silakan masuk menggunakan akun peserta.</p>

    <input id="email" type="email" placeholder="Email peserta">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">MASUK</button>

    <div id="loginMsg"></div>
  </div>


  <!-- APLIKASI -->
  <div id="app" class="hidden">

    <div class="card">
      <h1>Kelas UmmKha</h1>

      <p id="welcome" class="small"></p>

      <div class="topbar">
        <button onclick="showAccount()">👤 Akun Saya</button>
        <button class="secondary" onclick="logout()">KELUAR</button>
      </div>
    </div>


    <!-- AKUN -->
    <div id="accountBox" class="card hidden">
      <h2>👤 Akun Saya</h2>

      <p class="small">Email saat ini</p>
      <p id="currentEmail"></p>

      <hr>

      <h3>Ganti Email</h3>
      <input id="newEmail" type="email" placeholder="Email baru">
      <button onclick="changeEmail()">UBAH EMAIL</button>
      <div id="emailMsg"></div>

      <hr>

      <h3>Ganti Password</h3>
      <input id="newPass" type="password" placeholder="Password baru">
      <button onclick="changePassword()">GANTI PASSWORD</button>
      <div id="passMsg"></div>

      <button class="secondary" onclick="hideAccount()">TUTUP</button>
    </div>


    <!-- MATERI -->
    <div class="card">
      <h2>📚 Materi Kelas</h2>
      <div id="materials">Memuat materi...</div>
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://sngesuutjswqsgqciogi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_L8MDEGxyBOsyx_LM9GOvaw_AWVP1GuE";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   HELPER
========================= */

function esc(value){
  if(value === null || value === undefined) return "";
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showMessage(id,text,type="error"){
  const el=document.getElementById(id);
  if(!el)return;

  el.innerHTML =
    '<div class="'+type+'">'+esc(text)+'</div>';
}


/* =========================
   LOGIN
========================= */

async function login(){

  document.getElementById("loginMsg").innerHTML="";

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){
    showMessage(
      "loginMsg",
      "Email dan password wajib diisi."
    );
    return;
  }

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email:email,
      password:password
    });

  if(error){
    showMessage(
      "loginMsg",
      error.message
    );
    return;
  }

  await loadApp(data.user);
}


/* =========================
   LOAD APP
========================= */

async function loadApp(user){

  document.getElementById("login")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");

  document.getElementById("currentEmail")
    .textContent = user.email || "";

  const {data:profile} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();

  const nama =
    profile && profile.nama
      ? profile.nama
      : "Peserta";

  document.getElementById("welcome")
    .textContent =
      "Assalamu'alaikum, "+nama+" 🌷";

  await loadMaterials();
}


/* =========================
   CEK SESSION
========================= */

async function checkSession(){

  const {data} =
    await supabaseClient.auth.getSession();

  if(data.session){
    await loadApp(data.session.user);
  }
}

checkSession();

   LOAD MATERIALS
========================= */
